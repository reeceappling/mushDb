---
name: Deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: deployment-runner # TODO: deploy on custom runner?! FIX NAME
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'web/package.json'
          cache: 'npm'
      - name: Download Dependencies
        run: |
          go mod download
          npm ci # TODO: ensure ok

      # TODO: COMPILE GO
      # TODO: COMPILE TS
      - name: Create GitHub deployment
        id: deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: '${{ github.token }}'
          environment: 'production'
      - name: Set deployment pending
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          state: 'pending' # TODO: is this automatic on creation?
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
      # TODO: DEPLOY!
      - name: Wait for deploy complete
        run: |
          END_TIME=$((SECONDS + 120))
          sleep 30

          while [ $SECONDS -lt $END_TIME ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://mush.appli.ng" || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Update deployment status
        if: always()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          state: ${{ job.status }} # success or failure (could be cancelled, skipped? handle)
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
      - name: Fail on failure
        if: failure()
        run: exit 1

  # TODO: Get most recent deployment id
