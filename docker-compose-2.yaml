volumes:
  pictures:
    driver: local
    driver_opts:
      type: none
      device: ${LOCAL_IMAGES_DIR:?error}
      o: bind
  mongodb-data:
#    driver: local
#    driver_opts:
#      type: none
#      device: ${LOCAL_DB_DIR:?error}
#      o: bind
  grafana-data:
    driver: local
    driver_opts:
      type: none
      device: ${LOCAL_GRAFANA_DIR:?error} # TODO: ADD
      o: bind
  caddy-data:
    driver: local
    driver_opts:
      type: none
      device: ./caddy/data # TODO: ok?
      o: bind
configs:
  config.json: # TODO: generate via template?
    content: |
      {
        "cloudflare": [
          {
            "authentication": {
              "api_token": "${CLOUDFLARE_API_TOKEN:?error}",
            },
            "zone_id": "${CLOUDFLARE_ZONE_ID:?error}",
            "subdomains": [
              {
                "name": "",
                "proxied": false
              },
              {
                "name": "home",
                "proxied": false
              }
            ]
          }
        ],
        "a": false,
        "aaaa": true,
        "purgeUnknownRecords": true,
        "ttl": 120
      }