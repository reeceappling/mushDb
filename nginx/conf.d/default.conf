server {
    listen 80;          # Listen on IPv4
    listen [::]:80;     # Listen on IPv6
    server_name home.appli.ng;  # Adjust as necessary
    server_tokens on;

    location / {
        return 301 https://home.appli.ng$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_tokens on;
    server_name home.appli.ng;
    proxy_read_timeout 90s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 90s;

    ssl_certificate /etc/letsencrypt/live/home.appli.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.appli.ng/privkey.pem;
    location / {
        resolver 127.0.0.11 [::1];  # Ensure this is correct for your setup
        set $target http://api:80$request_uri;  # Ensure 'api' is the correct service name
        proxy_pass $target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
