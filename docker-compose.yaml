networks:
  mushNet:
    name: mushNet
volumes:
  pictures:
    driver: local
    driver_opts:
      type: none
      device: ${LOCAL_IMAGES_DIR:?error}
      o: bind
  mongodb-data:
#    driver: local
#    driver_opts:
#      type: none
#      device: ${LOCAL_DB_DIR:?error}
#      o: bind
  grafana-data:
    driver: local
    driver_opts:
      type: none
      device: ${LOCAL_GRAFANA_DIR:?error} # TODO: ADD
      o: bind
