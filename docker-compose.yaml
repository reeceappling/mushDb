version: '3.8'
services:
  # Service to maintain cloudflare tunnel (because homelab is behind CGNAT)
  cloudflared:
    image: cloudflare/cloudflared
    container_name: cloudflared
    environment:
      - TZ=America/New_York
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    networks:
      - mushNet
  # Main go api
  api:
    image: mush-api:latest
    restart: unless-stopped
    build:
      context: ./
      dockerfile: ./DockerfileApi
      tags:
        - "mush-api:latest"
    environment:
      PICS_PATH: "/images"
      API_PORT: "80"
      MAIN_API_EXTERNAL_PROTOCOL: ${MAIN_API_EXTERNAL_PROTOCOL:-http}
      MAIN_API_EXTERNAL_HOST: ${MAIN_API_EXTERNAL_HOST:-localhost}
      MONGO_INITDB_USERNAME: ${MONGO_INITDB_USERNAME:?error}
      MONGO_INITDB_PASSWORD: ${MONGO_INITDB_PASSWORD:?error}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:?error}
      ADMIN_USER: ${ADMIN_USER:?error}
      ADMIN_PASS: ${ADMIN_PASS:?error}
      RFID_SECRET: ${RFID_SECRET:?error}
      DB_HOST_PORT: "27017"
      DB_HOST_NAME: "mushdb"
      WEB_HOST_INTERNAL: "web"
      WEB_HOST_INTERNAL_PORT: "3000"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?error}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?error}
    volumes:
      - pictures:/images
    networks:
      - mushNet
  # React/Next.js webserver
#  web:
#    image: mush-web:latest
#    restart: unless-stopped
#    build:
#      context: ./rfid/client
#      dockerfile: ./Dockerfile
#      args:
#        MAIN_API_EXTERNAL_PROTOCOL: ${MAIN_API_EXTERNAL_PROTOCOL:-http}
#        MAIN_API_EXTERNAL_HOST: ${MAIN_API_EXTERNAL_HOST:-localhost}
#        MAIN_API_EXTERNAL_PORT: ${MAIN_API_EXTERNAL_PORT:-80}
#        MAIN_API_INTERNAL_HOST: "api"
#      tags:
#        - "mush-web:latest"
#    environment:
#      NEXT_PRIVATE_BASE_API_URL: "${MAIN_API_EXTERNAL_PROTOCOL:-http}://api"
#      NEXT_PUBLIC_BASE_API_URL: "${MAIN_API_EXTERNAL_PROTOCOL:-http}://${MAIN_API_EXTERNAL_HOST:-localhost}"
#     networks:
#       - mushNet
  # fungi database container
  mushdb:
    image: mongo:4
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?error}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?error}
      MONGO_INITDB_USERNAME: ${MONGO_INITDB_USERNAME:?error}
      MONGO_INITDB_PASSWORD: ${MONGO_INITDB_PASSWORD:?error}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:?error}
    command: [--auth]
    volumes:
      - mongodb-data:/data/db
      - ./initDB:/docker-entrypoint-initdb.d
    networks:
      - mushNet
  # grafana service
