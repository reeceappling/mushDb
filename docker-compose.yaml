networks:
  mushNet:
    name: mushNet
secrets:
    SESSION_SECRET:
        environment: GOTHIC_SESSION_SECRET
    MONGO_INITDB_PASSWORD:
        environment: MONGO_INITDB_PASSWORD
    MONGO_INITDB_SETUP_PASSWORD:
        environment: MONGO_INITDB_SETUP_PASSWORD
    GOOGLE_CLIENT_ID:
        environment: GOOGLE_CLIENT_ID
    GOOGLE_CLIENT_SECRET:
        environment: GOOGLE_CLIENT_SECRET
    RFID_SECRET:
        environment: RFID_SECRET
volumes:
  pictures:
    labels:
      # TODO: different label key?
      com.example.description: "Persistent volume for images"
    driver: local
    driver_opts:
      type: none
      device: ${LOCAL_IMAGES_DIR:?error}
      o: bind
  mongodb-data:
    driver: local
    # TODO: labels for volume description?
    driver_opts:
      type: none
      device: ${LOCAL_DB_DIR:?error}
      o: bind
  backups:
    # TODO: consider removing backups volume!
    driver: local
    # TODO: labels for volume description?
    driver_opts:
      type: none
      device: ${LOCAL_DB_BACKUPS_DIR:?error}
      o: bind
