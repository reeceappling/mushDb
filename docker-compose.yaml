version: '3.8'#TODO: REMOVE, DEPRECATED
include:
  - docker-compose-web-prod.yaml
  # TODO: Use the next line instead to run the dev version instead of the prod webserver version. This is useful for local development and testing.
  #- docker-compose-web-dev.yaml
services:
  # Service to maintain cloudflare tunnel (because homelab is behind CGNAT)
  cloudflared:
    image: cloudflare/cloudflared
    container_name: cloudflared
    environment:
      - TZ=America/New_York
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    networks:
      - mushNet
  # Main go api
  api:
    image: mush-api:latest
    command: ./server
    restart: unless-stopped
    build:
      context: ./
      dockerfile: ./DockerfileApi
      tags:
        - "mush-api:latest"
    secrets:
      - SESSION_SECRET
      - MONGO_INITDB_PASSWORD
      - MONGO_INITDB_SETUP_PASSWORD
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - RFID_SECRET
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?error}
      SESSION_SECRET: ${GOTHIC_SESSION_SECRET:-https} # Must be in ENV for goth to work
      PICS_PATH: "/images"
      MAIN_API_EXTERNAL_PROTOCOL: ${MAIN_API_EXTERNAL_PROTOCOL:-https}
      MAIN_API_EXTERNAL_HOST: ${MAIN_API_EXTERNAL_HOST:-localhost}
      MONGO_INITDB_SETUP_USERNAME: ${MONGO_INITDB_SETUP_USERNAME:?error}
      MONGO_INITDB_USERNAME: ${MONGO_INITDB_USERNAME:?error}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:?error}
      ADMIN_GMAIL: ${ADMIN_GMAIL:?error}
      DB_HOST_PORT: "27017"
      DB_HOST_NAME: "mushdb"
      WEB_HOST_INTERNAL: "web" # TODO: use this in typescript?
      WEB_HOST_INTERNAL_PORT: "3000" # TODO: use this in typescript?
    volumes:
      - pictures:/images
    networks:
      - mushNet
    links:
      - mushdb
    depends_on:
      - mushdb
  mushdb: # fungi database container # TODO: different db container for dev vs prod...
    image: mongo:4.4
    restart: unless-stopped
    environment:
      # TODO: secrets instead of env vars?
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?error}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?error}
      MONGO_INITDB_SETUP_USERNAME: ${MONGO_INITDB_SETUP_USERNAME:?error}
      MONGO_INITDB_SETUP_PASSWORD: ${MONGO_INITDB_SETUP_PASSWORD:?error}
      MONGO_INITDB_BACKUP_USERNAME: ${MONGO_INITDB_BACKUP_USERNAME:?error}
      MONGO_INITDB_BACKUP_PASSWORD: ${MONGO_INITDB_BACKUP_PASSWORD:?error}
      MONGO_INITDB_USERNAME: ${MONGO_INITDB_USERNAME:?error}
      MONGO_INITDB_PASSWORD: ${MONGO_INITDB_PASSWORD:?error}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:?error}
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/etc/mongodb.key", "--bind_ip_all"]
    healthcheck:
      # Automatically initiates the replica set if it isn't already active
      test: >
        mongo --username ${MONGO_INITDB_ROOT_USERNAME:?error} --password ${MONGO_INITDB_ROOT_PASSWORD:?error} --authenticationDatabase admin --quiet 
        --eval "rs.status().ok || rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mushdb:27017' }] })"
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - mongodb-data:/data/db
      - ./initDB:/docker-entrypoint-initdb.d
      - ./etc/mongodb.key:/etc/mongodb.key:ro
    networks:
      - mushNet
